# SPDX-License-Identifier: Apache-2.0
---
name: 'test: spelling'
description: 'Composite action to test spelling'

inputs:
  FILEPATHS:
    description: 'Filepaths to look at, specified as a comma separated string ie "docs/**/*.md,blog/**/*.md,etc"'
    required: false
    default: |
      **/*.md
      **/*.mdx


runs:
  using: "composite"
  steps:
    # Also set `fetch-depth: 0` on the source repo so the action can compare the current head against the base branch.
    # Vale uses this commit's config. It does not check out main, so a pilot branch stays off the shared config.

    # v47.0.5
    - uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # 47.0.5
      id: changed-files
      with:
        path: "."  # look in the main repo root
        files: ${{ inputs.FILEPATHS }}
        separator: ","
 
    - name: List Changed Files
      if: steps.changed-files.outputs.any_changed == 'true'
      shell: bash
      run: |
        echo "The following files were detected for spellcheck:"
        echo "${{ steps.changed-files.outputs.all_changed_files }}"

    # need this for vale
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Add the repository word list
      if: steps.changed-files.outputs.any_changed == 'true'
      shell: bash
      run: |
        dest="${{ github.action_path }}/styles/config/vocabularies/Repo"
        mkdir -p "$dest"
        src="${GITHUB_WORKSPACE}/.github/vale/accept.txt"
        if [ -f "$src" ]; then
          cp "$src" "$dest/accept.txt"
        fi

    # d89dee975228ae261d22c15adcd03578634d429c = v2.1.1
    - name: Vale
      if: steps.changed-files.outputs.any_changed == 'true'
      uses: errata-ai/vale-action@d89dee975228ae261d22c15adcd03578634d429c
      with:
        files: ${{ steps.changed-files.outputs.all_changed_files }}
        vale_flags: "--config ${{ github.action_path }}/.vale.ini"
        # fail_on_error: true
        reporter: github-pr-check
        separator: ","