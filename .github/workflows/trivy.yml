---
# Reusable workflow: scan the repository with Trivy and upload the results to
# the Security tab (code scanning, category "trivy").
#
# Pull requests only upload, so GitHub annotates the alerts the pull request
# introduces. Every other event also fails the run when a finding at
# `severity` remains, and a scheduled run then posts to Slack.
#
# The job runs in the calling repository, in the environment named by the
# `environment` input (default `security`). Each calling repository stores the
# incoming webhook for its own channel as a SLACK_WEBHOOK secret in that
# environment; nothing about Slack is stored here. The caller must also pass
# SLACK_WEBHOOK by name: setting the environment only selects which value the
# job receives, and a secret the caller doesn't pass resolves to an empty
# string. Without the secret the notification is skipped.
#
# Call it on push to the default branch and on a daily schedule: the Security
# tab shows default-branch results, and new CVEs land on unchanged code.
#
# The trivy-action restores and saves the vulnerability DB in the Actions
# cache itself, and the scheduled run on the default branch refreshes it for
# every branch, so no separate cache workflow is needed.
#
# Findings are suppressed with a `.trivyignore` at the repository root.
#
# Caller:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#     schedule:
#       - cron: "23 4 * * *"
#     workflow_dispatch:
#
#   permissions: {}
#
#   jobs:
#     trivy:
#       permissions:
#         actions: read
#         contents: read
#         security-events: write
#       uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@<sha> # <version>
#       with:
#         environment: security
#       secrets:
#         SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

name: trivy

on:
  workflow_call:
    inputs:
      scan-ref:
        description: 'Path to scan, relative to the repository root'
        type: string
        default: '.'
      scanners:
        description: 'Comma-separated Trivy scanners'
        type: string
        default: 'vuln,secret,misconfig'
      severity:
        description: 'Comma-separated severities to report and fail on'
        type: string
        default: 'HIGH,CRITICAL'
      runs-on:
        description: 'Runner label'
        type: string
        default: 'ubuntu-24.04'
      environment:
        description: "Environment in the calling repository that holds the SLACK_WEBHOOK secret"
        type: string
        default: 'security'
    secrets:
      SLACK_WEBHOOK:
        description: 'Incoming webhook notified when a scheduled scan fails; the value comes from the environment input'
        required: false

permissions: {}

jobs:
  trivy:
    name: Trivy
    runs-on: ${{ inputs.runs-on }}
    # The job receives the value of SLACK_WEBHOOK from this environment in the
    # calling repository; the caller still has to pass the secret by name.
    environment: ${{ inputs.environment }}
    permissions:
      actions: read # upload-sarif needs it on private repositories
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # v0.36.0, also uses aquasecurity/setup-trivy@v0.2.6 and actions/cache@v5 (Node 24)
      # The cache lives outside the workspace so the fs scan does not walk it.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.scan-ref }}
          scanners: ${{ inputs.scanners }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          format: 'sarif'
          output: ${{ runner.temp }}/trivy-results.sarif
          limit-severities-for-sarif: true
          cache-dir: ${{ runner.temp }}/.cache/trivy

      # Pull requests from forks get a read-only token and cannot upload.
      - name: Upload Trivy scan results to GitHub Security tab
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-results.sarif
          category: trivy

      - name: Check findings
        shell: bash
        env:
          SARIF: ${{ runner.temp }}/trivy-results.sarif
          SEVERITY: ${{ inputs.severity }}
          ENFORCE: ${{ github.event_name != 'pull_request' }}
          ALERTS_URL: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3ATrivy+is%3Aopen
        run: |
          count=$(jq '[.runs[].results[]?] | length' "$SARIF")
          {
            echo "## Trivy: ${count} finding(s) at ${SEVERITY}"
            echo
            echo "[Open Trivy alerts](${ALERTS_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ] && [ "$ENFORCE" = "true" ]; then
            echo "::error::Trivy found ${count} finding(s) at ${SEVERITY}: ${ALERTS_URL}"
            exit 1
          fi

      - name: Notify Slack
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ENVIRONMENT: ${{ inputs.environment }}
          TEXT: >-
            :rotating_light: Trivy scheduled scan failed for ${{ github.repository }}:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "No SLACK_WEBHOOK in the ${ENVIRONMENT} environment; skipping notification."
            exit 0
          fi
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK"
