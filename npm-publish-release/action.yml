# SPDX-License-Identifier: Apache-2.0
---
name: 'npm-publish-release'
description: >-
  Create a GitHub release v<root version> with notes from the changelog. In a
  monorepo with independently versioned packages, release each public package
  whose <name>@<version> tag does not exist yet, and push those tags. The
  checked-out HEAD must be the release commit (github.sha by default), and the
  files read must be committed at HEAD without changes. Safe to re-run: an
  existing release and tags at that commit are kept.

inputs:
  release-commit:
    description: >-
      The full SHA of the commit to release. The release targets it, the tags
      go on it, and the checked-out HEAD must be it. Defaults to github.sha.
    required: false
    default: ${{ github.sha }}

outputs:
  release-version:
    description: 'The release version: the root package.json version.'
    value: ${{ steps.prepare.outputs.release-version }}

runs:
  using: composite
  steps:
    # Reads manifests and changelogs only. No Yarn, npm or Node.js runs in this
    # action: the job holds a token with contents: write. BASH_ENV and ENV are
    # cleared so that values an earlier step wrote to $GITHUB_ENV do not run
    # code in these steps.
    - name: Prepare release
      id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN || github.token }}
        RELEASE_DIR: ${{ runner.temp }}/npm-publish-release
        ACTION_PATH: ${{ github.action_path }}
        BASH_ENV: ''
        ENV: ''
      run: '"$ACTION_PATH/scripts/prepare-release.sh"'

    - name: Create release
      shell: bash
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN || github.token }}
        RELEASE_COMMIT_ID: ${{ inputs.release-commit }}
        RELEASE_VERSION: ${{ steps.prepare.outputs.release-version }}
        RELEASE_MODE: ${{ steps.prepare.outputs.mode }}
        RELEASE_DIR: ${{ runner.temp }}/npm-publish-release
        ACTION_PATH: ${{ github.action_path }}
        BASH_ENV: ''
        ENV: ''
      run: '"$ACTION_PATH/scripts/create-release.sh"'
