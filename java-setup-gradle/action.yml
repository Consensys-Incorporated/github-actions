---
name: 'java-setup-gradle'
description: 'java-setup-gradle'

inputs:
  VERSION:
    description: "jdk version to use"
    required: false
    default: '25'
  DISTRIBUTION:
    description: "jdk distribution to use"
    required: false
    default: 'temurin'

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: ${{ inputs.VERSION }}
        distribution: '${{ inputs.DISTRIBUTION }}'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
