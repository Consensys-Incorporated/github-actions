# SPDX-License-Identifier: Apache-2.0
---
name: 'check-changelog'
description: >-
  On a pull request, fail if a public workspace package has user-facing
  changes but its CHANGELOG.md has no entry linking the pull request, unless
  the pull request has the `no-changelog` label.

inputs:
  base-branch:
    description: 'The branch the pull request targets. Defaults to the event''s base branch.'
    required: false
    default: ${{ github.event.pull_request.base.ref }}
  labels:
    description: 'The pull request labels, as JSON. Defaults to the event''s labels.'
    required: false
    default: ${{ toJSON(github.event.pull_request.labels) }}
  pr-number:
    description: 'The pull request number that changelog entries must link. Defaults to the event''s.'
    required: false
    default: ${{ github.event.pull_request.number }}

runs:
  using: composite
  steps:
    # The checkout below uses the event's pull request number, so the event
    # must be pull_request. pull_request_target would run with a write token
    # and secrets while reading the pull request's content.
    - name: Check event
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        if [[ "$EVENT_NAME" != pull_request ]]; then
          echo "::error::check-changelog runs only on pull_request events, not $EVENT_NAME."
          exit 1
        fi
        if [[ ! "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::The pull_request event has no pull request number."
          exit 1
        fi
        if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::The pr-number input must be a pull request number."
          exit 1
        fi
        if [[ -z "$BASE_BRANCH" ]]; then
          echo "::error::The base-branch input is empty."
          exit 1
        fi

    - name: Check for no-changelog label
      id: label-check
      shell: bash
      env:
        PR_LABELS: ${{ inputs.labels }}
      run: |
        if jq -e '.[] | select(.name == "no-changelog")' <<<"$PR_LABELS" >/dev/null; then
          echo "no-changelog label found, skipping changelog check."
          echo "skip=true" >>"$GITHUB_OUTPUT"
        else
          echo "No no-changelog label found, proceeding with check."
          echo "skip=false" >>"$GITHUB_OUTPUT"
        fi

    - name: Check out pull request head
      if: ${{ steps.label-check.outputs.skip != 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # GitHub mirrors every pull request's head, from a fork too, into the
        # base repository under this ref.
        repository: ${{ github.repository }}
        ref: refs/pull/${{ github.event.pull_request.number }}/head
        path: target-repo
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Node.js
      if: ${{ steps.label-check.outputs.skip != 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Install check dependencies
      if: ${{ steps.label-check.outputs.skip != 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

    - name: Check changelog
      if: ${{ steps.label-check.outputs.skip != 'true' }}
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/check-changelog.ts" target-repo "$BASE_BRANCH" "$PR_NUMBER"
