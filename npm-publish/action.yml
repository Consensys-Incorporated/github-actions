# SPDX-License-Identifier: Apache-2.0
---
name: 'npm-publish'
description: >-
  Publish every public workspace package whose current version is not on npm
  yet: with OIDC for packages already on npm, and with a token for a
  package's first publish. Without a usable credential, pack the packages
  instead (a dry run). The repository cannot run code while publishing.

inputs:
  npm-token:
    description: 'npm token, used only for the first publish of a package. Later publishes use OIDC.'
    required: false
    default: ''
  dry-run:
    description: >-
      `true` to pack instead of publishing. `false` to fail when a credential
      is missing instead of packing. Unset: pack when a credential is missing.
    required: false
    default: ''
  npm-tag:
    description: 'The npm dist-tag to publish to.'
    required: false
    default: latest
  staged-publish:
    description: 'Whether to use staged publishing. Defaults to "true". If set to "false", the action will publish directly to NPM without a staging step.'
    required: false
    default: 'true'
  provenance:
    description: 'Whether to include provenance information in the package. Must be disabled for private repositories. Defaults to "true".'
    required: false
    default: 'true'
  slack-webhook-url:
    description: 'Slack incoming webhook. If set, post a message that the release is awaiting deployment.'
    required: false
    default: ''
  channel:
    description: 'Slack channel to post in, without `#`. Defaults to the webhook''s channel.'
    required: false
    default: ''
  subteam:
    description: 'Slack user group ID to mention.'
    required: false
    default: ''
  username:
    description: 'Name of the bot in Slack.'
    required: false
    default: 'MetaMask bot'
  icon-url:
    description: 'Avatar URL of the bot in Slack.'
    required: false
    default: 'https://raw.githubusercontent.com/MetaMask/action-npm-publish/main/robo.png'

runs:
  using: composite
  steps:
    - name: Sanitize Yarn configuration
      shell: bash
      env:
        YARN_IGNORE_PATH: '1'
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/sanitize.sh"'

    - name: Publish
      id: publish
      shell: bash
      env:
        YARN_IGNORE_PATH: '1'
        YARN_NPM_AUTH_TOKEN: ${{ inputs.npm-token }}
        PUBLISH_NPM_TAG: ${{ inputs.npm-tag }}
        STAGED_PUBLISH: ${{ inputs.staged-publish }}
        PROVENANCE: ${{ inputs.provenance }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/main.sh"'

    - name: Install pkdiff
      if: ${{ steps.publish.outputs.dry-run == 'true' }}
      shell: bash
      run: npm i -g pkdiff@2.0.1

    - name: Generate package diff report
      if: ${{ steps.publish.outputs.dry-run == 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/report.sh"'

    - name: Upload packages and report
      if: ${{ steps.publish.outputs.dry-run == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        path: |
          /tmp/*.tgz
          /tmp/*.html

    - name: Generate Slack publish message (1/2)
      id: name-version
      shell: bash
      if: inputs.slack-webhook-url != ''
      run: |
        NAME_VERSION_TEXT=$(jq --raw-output '.name + "@" + .version' package.json )
        NAME_VERSION_TEXT_STRIPPED="${NAME_VERSION_TEXT#@}"
        echo "NAME_VERSION=$NAME_VERSION_TEXT_STRIPPED" >> "$GITHUB_OUTPUT"
    - name: Generate Slack publish message (2/2)
      id: final-text
      shell: bash
      if: inputs.slack-webhook-url != ''
      env:
        NAME_VERSION: ${{ steps.name-version.outputs.NAME_VERSION }}
        SUBTEAM_TEXT: ${{ inputs.subteam }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        DEFAULT_TEXT="\`$NAME_VERSION\` is awaiting deployment :rocket: \n <https://github.com/$REPOSITORY/actions/runs/$RUN_ID/|→ Click here to review deployment> \n <https://www.notion.so/metamask-consensys/NPM-publishing-with-OIDC-374f86d67d68805583e9f824ff5ff18e#374f86d67d68807da68cf75485fd70d2|→ See instructions for approving staged packages here>"
        FINAL_TEXT="$DEFAULT_TEXT"
        if [[ ! "$SUBTEAM_TEXT" == "" ]]; then
          FINAL_TEXT="<!subteam^$SUBTEAM_TEXT> $DEFAULT_TEXT"
        fi
        echo "FINAL_TEXT=$FINAL_TEXT" >> "$GITHUB_OUTPUT"
    - name: Post to a Slack channel
      if: ${{ inputs.slack-webhook-url != '' && inputs.channel != '' }}
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "${{ steps.final-text.outputs.FINAL_TEXT }}",
            "icon_url": "${{ inputs.icon-url }}",
            "username": "${{ inputs.username }}",
            "channel": "#${{ inputs.channel }}"
          }
      continue-on-error: true
    - name: Post to a default Slack channel
      if: ${{ inputs.slack-webhook-url != '' && inputs.channel == '' }}
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "${{ steps.final-text.outputs.FINAL_TEXT }}",
            "icon_url": "${{ inputs.icon-url }}",
            "username": "${{ inputs.username }}"
          }
      continue-on-error: true
