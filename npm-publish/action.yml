# SPDX-License-Identifier: Apache-2.0
---
name: 'npm-publish'
description: >-
  Publish every public workspace package whose current version is not on npm
  yet: with OIDC (staged, with provenance) for packages already on npm, and
  with a token for a package's first publish. Without a usable credential,
  pack the packages instead (a dry run). The repository cannot run code while
  publishing.

inputs:
  npm-token:
    description: 'npm token, used only for the first publish of a package. Later publishes use OIDC.'
    required: false
    default: ''
  dry-run:
    description: >-
      `true` to pack instead of publishing. `false` to fail when a credential
      is missing instead of packing. Unset: pack when a credential is missing.
    required: false
    default: ''
  npm-tag:
    description: 'The npm dist-tag to publish to.'
    required: false
    default: latest
  slack-webhook-url:
    description: 'Slack incoming webhook. If set, post a message that the release is awaiting deployment.'
    required: false
    default: ''
  channel:
    description: 'Slack channel to post in, without `#`. Defaults to the webhook''s channel.'
    required: false
    default: ''
  subteam:
    description: 'Slack user group ID to mention.'
    required: false
    default: ''
  username:
    description: 'Name of the bot in Slack.'
    required: false
    default: npm-publish
  icon-url:
    description: 'Avatar URL of the bot in Slack.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Sanitize Yarn configuration
      shell: bash
      env:
        YARN_IGNORE_PATH: '1'
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/sanitize.sh"'

    - name: Publish
      id: publish
      shell: bash
      env:
        YARN_IGNORE_PATH: '1'
        YARN_NPM_AUTH_TOKEN: ${{ inputs.npm-token }}
        PUBLISH_NPM_TAG: ${{ inputs.npm-tag }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/main.sh"'

    - name: Install pkdiff
      if: ${{ steps.publish.outputs.dry-run == 'true' }}
      shell: bash
      run: npm i -g pkdiff@2.0.1

    - name: Generate package diff report
      if: ${{ steps.publish.outputs.dry-run == 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/report.sh"'

    - name: Upload packages and report
      if: ${{ steps.publish.outputs.dry-run == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        path: |
          /tmp/*.tgz
          /tmp/*.html

    - name: Generate Slack payload
      id: slack-payload
      if: ${{ inputs.slack-webhook-url != '' }}
      continue-on-error: true
      shell: bash
      env:
        PAYLOAD_FILE: ${{ runner.temp }}/npm-publish-slack-payload.json
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        SLACK_SUBTEAM: ${{ inputs.subteam }}
        SLACK_USERNAME: ${{ inputs.username }}
        SLACK_ICON_URL: ${{ inputs.icon-url }}
        SLACK_CHANNEL: ${{ inputs.channel }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/slack-payload.sh"'

    - name: Post to Slack
      if: ${{ inputs.slack-webhook-url != '' && steps.slack-payload.outcome == 'success' }}
      continue-on-error: true
      uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ runner.temp }}/npm-publish-slack-payload.json
        retries: rapid
