---
name: 'renovatebot'
description: 'Composite action to run renovatebot on the versions of the GHA'

inputs:
  GH_APP_ID:
    description: 'GitHub App ID'
    required: true
  GH_PRIVATE_KEY:
    description: 'GitHub App Private Key'
    required: true
  GH_REPOSITORY:
    description: 'Github repo to look at'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout tools repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: Consensys-Incorporated/github-actions
        path: .github-actions

    - name: Generate Token
      id: generate_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.GH_APP_ID }}
        private-key: ${{ inputs.GH_PRIVATE_KEY }}

    - name: Run Renovate
      uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
      with:
        configurationFile: renovate.json
        token: ${{ steps.generate_token.outputs.token }}
      env:
        RENOVATE_REPOSITORIES: ${{ inputs.GH_REPOSITORY }}
        RENOVATE_PLATFORM: github
        # LOG_LEVEL: debug