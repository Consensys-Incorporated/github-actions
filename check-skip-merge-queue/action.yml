---
name: 'check-skip-merge-queue'
description: >-
  In a merge_group run, report whether the pull request is first in the merge
  queue and its branch already contains the base branch. If so, the caller can
  skip jobs that the pull request's own run already ran on the same tree.

inputs:
  head-ref:
    description: 'The merge group head ref. Defaults to the head ref of the merge_group event.'
    required: false
    default: ${{ github.event.merge_group.head_ref }}
  base-ref:
    description: 'The base branch, with or without `refs/heads/`. Defaults to the base ref of the merge_group event.'
    required: false
    default: ${{ github.event.merge_group.base_ref }}
  github-token:
    description: 'Token with `pull-requests: read` and `contents: read`.'
    required: false
    default: ${{ github.token }}

outputs:
  pr-number:
    description: 'The pull request number, if the pull request was found.'
    value: ${{ steps.pr-details.outputs.pr-number }}
  up-to-date:
    description: >-
      `true` if the pull request is first in the merge queue and up to date
      with the base branch; `false` otherwise, including when a lookup fails.
    value: ${{ steps.up-to-date.outputs.up-to-date || 'false' }}

runs:
  using: composite
  steps:
    # Both steps continue on error: any failure yields up-to-date=false, and
    # the caller runs everything.
    - name: Get pull request details
      id: pr-details
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        HEAD_REF: ${{ inputs.head-ref }}
        SCRIPT_PATH: ${{ github.action_path }}/scripts/check-skip-merge-queue.cjs
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { getPullRequestDetails } = require(process.env.SCRIPT_PATH);
          await getPullRequestDetails({ github, context, core, headRef: process.env.HEAD_REF });

    - name: Check if pull request is up to date with base branch
      id: up-to-date
      if: ${{ steps.pr-details.outcome == 'success' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        BASE_REF: ${{ inputs.base-ref }}
        PR_HEAD_SHA: ${{ steps.pr-details.outputs.pr-head-sha }}
        MERGE_QUEUE_POSITION: ${{ steps.pr-details.outputs.merge-queue-position }}
        SCRIPT_PATH: ${{ github.action_path }}/scripts/check-skip-merge-queue.cjs
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { checkUpToDate } = require(process.env.SCRIPT_PATH);
          await checkUpToDate({
            github,
            context,
            core,
            baseRef: process.env.BASE_REF,
            prHeadSha: process.env.PR_HEAD_SHA,
            mergeQueuePosition: process.env.MERGE_QUEUE_POSITION,
          });
