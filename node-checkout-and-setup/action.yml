# SPDX-License-Identifier: Apache-2.0
---
name: 'node-checkout-and-setup'
description: 'Check out the repository if needed, set up Node.js and Corepack, and run `yarn --immutable`, with an optional node_modules cache.'

inputs:
  is-high-risk-environment:
    description: >-
      Required. `true` for jobs that hold write tokens or publish credentials:
      no Actions cache is read. `false` enables caching.
    required: true
  node-version:
    description: 'Node.js version (e.g. `24.x`, `24`, `v24.13.0`, `lts/*`). Defaults to the contents of `.nvmrc`.'
    required: false
    default: ''
  cache-node-modules:
    description: >-
      Save node_modules to the cache after installing, and skip setup entirely
      when the cache already holds an entry for this lockfile. Meant for a
      "prepare" job that warms the cache for the rest of the run. When
      `is-high-risk-environment` is `true`, the cache is only written.
    required: false
    default: 'false'
  ref:
    description: 'Branch, tag or SHA to check out. Defaults to the commit that triggered the workflow.'
    required: false
    default: ''
  persist-credentials:
    description: 'Passed to `actions/checkout`. Set to `false` unless later steps use the job token from `.git/config` (e.g. to push).'
    required: false
    default: 'true'
  skip-install:
    description: 'Check out and set up Node.js only. No Yarn command runs, and no cache is used.'
    required: false
    default: 'false'
  skip-allow-scripts:
    description: 'Do not run `yarn allow-scripts` after restoring node_modules from the cache.'
    required: false
    default: 'false'
  force-setup:
    description: >-
      With `cache-node-modules: true`, do not skip setup on a cache hit. Use
      this when later steps in the same job need a prepared workspace.
    required: false
    default: 'false'

# The outputs are for the unit tests in `build-lint-test.yml`, and
# probably not useful for other workflows.
outputs:
  node-modules-cache-hit:
    description: 'Whether the node_modules cache was hit.'
    value: ${{ steps.restore-node-modules.outputs.cache-hit || steps.try-skip-setup.outputs.cache-hit }}
  yarn-cache-hit:
    description: 'Whether the yarn cache was hit.'
    value: ${{ steps.restore-yarn-cache.outputs.cache-hit }}
  computed-node-version:
    description: 'The truncated version of Node.js that was computed.'
    value: ${{ steps.compute-node-version.outputs.node-version }}
  node-version:
    description: 'The full version of Node.js that was actually used.'
    value: ${{ steps.setup-node.outputs.node-version }}
  skipped-setup:
    description: 'Whether the setup steps were skipped due to a cache hit.'
    value: ${{ steps.try-skip-setup.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        IS_HIGH_RISK_ENVIRONMENT: ${{ inputs.is-high-risk-environment }}
        CACHE_NODE_MODULES: ${{ inputs.cache-node-modules }}
      run: |
        if [[ "$IS_HIGH_RISK_ENVIRONMENT" == "true" ]]; then
          if [[ "$CACHE_NODE_MODULES" == "true" ]]; then
            echo 'High-risk environment: cache reads disabled, cache save enabled (write-only mode).'
          else
            echo 'High-risk environment: all caching disabled.'
          fi
        elif [[ "$IS_HIGH_RISK_ENVIRONMENT" == "false" ]]; then
          echo 'Low-risk environment: caching enabled.'
        else
          echo "::error::'is-high-risk-environment' must be 'true' (no cache) or 'false' (cache enabled)."
          exit 1
        fi

    - name: Download repository metadata
      id: download-metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        IS_HIGH_RISK_ENVIRONMENT: ${{ inputs.is-high-risk-environment }}
        CACHE_NODE_MODULES: ${{ inputs.cache-node-modules }}
        SKIP_INSTALL: ${{ inputs.skip-install }}
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        OWNER_AND_REPO: ${{ github.repository }}
        COMMIT_HASH: ${{ inputs.ref || github.sha }}
        REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        METADATA_DIR: ${{ runner.temp }}/node-checkout-and-setup-metadata
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/download-metadata.sh"'

    - name: Compute Node.js version
      id: compute-node-version
      shell: bash
      env:
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        NVMRC_FILE: ${{ steps.download-metadata.outputs.nvmrc-path }}
        NODE_INDEX_FILE: ${{ runner.temp }}/node-release-index.json
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/compute-node-version.sh"'

    - name: Compute node_modules cache paths
      id: compute-cache-paths
      if: ${{ (inputs.is-high-risk-environment == 'false' || inputs.cache-node-modules == 'true') && inputs.skip-install != 'true' }}
      shell: bash
      env:
        PACKAGE_JSON_FILE: ${{ steps.download-metadata.outputs.package-json-path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/compute-cache-paths.sh"'

    - name: Skip setup if node_modules is already cached
      id: try-skip-setup
      if: ${{ inputs.is-high-risk-environment == 'false' && inputs.cache-node-modules == 'true' && steps.download-metadata.outputs.yarn-lock-available == 'true' && inputs.force-setup != 'true' && inputs.skip-install != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.compute-cache-paths.outputs.paths }}
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.compute-node-version.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
        lookup-only: true

    - name: Check out repository
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' && hashFiles('.git') == '' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 1
        ref: ${{ inputs.ref }}
        persist-credentials: ${{ inputs.persist-credentials }}

    - name: Resolve Node.js release
      id: resolve-node-version
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        COMPUTED_NODE_VERSION: ${{ steps.compute-node-version.outputs.node-version }}
        NODE_INDEX_FILE: ${{ runner.temp }}/node-release-index.json
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/resolve-node-version.sh"'

    # package-manager-cache is off so that no cache is used here regardless of
    # what the repository's package.json declares.
    - name: Set up Node.js
      id: setup-node
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ steps.resolve-node-version.outputs.node-version }}
        package-manager-cache: false

    - name: Enable Corepack
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
      run: |
        echo "Using Node.js $NODE_VERSION"
        corepack enable

    - name: Restore node_modules from cache
      id: restore-node-modules
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' && inputs.is-high-risk-environment == 'false' && inputs.skip-install != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.compute-cache-paths.outputs.paths }}
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.compute-node-version.outputs.node-version }}-${{ hashFiles('yarn.lock') }}

    # On a node_modules cache miss, restore Yarn's download cache instead.
    # Low-risk only.
    - name: Restore Yarn cache
      id: restore-yarn-cache
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' && inputs.is-high-risk-environment != 'true' && steps.restore-node-modules.outputs.cache-hit != 'true' && inputs.skip-install != 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ steps.setup-node.outputs.node-version }}
        cache: yarn

    - name: Install dependencies
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' && steps.restore-node-modules.outputs.cache-hit != 'true' && inputs.skip-install != 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/scripts/retry.sh" yarn --immutable'

    # The install above runs allow-scripts itself; after a cache restore it has
    # to run separately.
    - name: Run allow-scripts
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' && steps.restore-node-modules.outputs.cache-hit == 'true' && inputs.skip-allow-scripts != 'true' && inputs.skip-install != 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if yarn bin allow-scripts &>/dev/null; then
          "$ACTION_PATH/scripts/retry.sh" yarn allow-scripts
        else
          echo 'allow-scripts is not installed; skipping.'
        fi

    # In a high-risk environment the restore steps above are skipped, but the
    # cache is still saved (write-only mode).
    - name: Save node_modules to cache
      if: ${{ steps.try-skip-setup.outputs.cache-hit != 'true' && inputs.cache-node-modules == 'true' && steps.restore-node-modules.outputs.cache-hit != 'true' && inputs.skip-install != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.compute-cache-paths.outputs.paths }}
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.compute-node-version.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
